<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陌生人聊天</title>
<style>
    :root { --bg: #f4f1ea; --card: #fff; --text: #222; --muted: #888; --me: #ffd76a; --them: #e9e9e9; --accent: #e8a200; }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --muted: #999; --me: #7a5b00; --them: #333; }
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; justify-content: center; }
    main { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: var(--card); }
    header { padding: 12px 16px; font-weight: bold; border-bottom: 1px solid var(--them); }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .me { align-self: flex-end; background: var(--me); }
    .them { align-self: flex-start; background: var(--them); }
    .sys { align-self: center; color: var(--muted); font-size: 0.9em; text-align: center; }
    #typing { min-height: 1.4em; padding: 0 16px; color: var(--muted); font-size: 0.85em; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--them); }
    input { flex: 1; min-width: 0; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; background: var(--card); color: var(--text); font-size: 1em; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #000; font-size: 1em; cursor: pointer; }
    button.secondary { background: var(--them); color: var(--text); }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<main>
    <header>陌生人聊天 · 匿名一對一</header>
    <div id="log" aria-live="polite"><p class="sys">按「開始聊天」，隨機配對一位陌生人。</p></div>
    <div id="typing"></div>
    <form id="form">
        <button type="button" id="action">開始聊天</button>
        <input id="text" maxlength="1000" autocomplete="off" placeholder="輸入訊息…" aria-label="訊息" disabled>
        <button id="sendBtn" disabled>送出</button>
    </form>
</main>
<script>
    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");
    const action = document.getElementById("action");
    const typing = document.getElementById("typing");
    let id = null;
    let state = "idle"; // idle | waiting | chatting
    let typingTimer;
    let lastTypingSent = 0;

    const send = (type, extra) => fetch("send", { method: "POST", body: JSON.stringify({ id, type, ...extra }) });

    function add(cls, content) {
        const p = document.createElement("p");
        p.className = cls;
        p.textContent = content;
        log.append(p);
        log.scrollTop = log.scrollHeight;
    }

    function setState(next) {
        state = next;
        const chatting = state === "chatting";
        text.disabled = sendBtn.disabled = !chatting;
        action.textContent = chatting ? "離開" : state === "waiting" ? "配對中…" : "開始聊天";
        action.className = chatting ? "secondary" : "";
        action.disabled = state === "waiting";
        if (chatting) text.focus();
        typing.textContent = "";
    }

    function find() {
        log.replaceChildren();
        send("find");
    }

    const events = new EventSource("events");
    events.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "hello") id = data.id;
        else if (data.type === "waiting") { setState("waiting"); add("sys", "正在尋找陌生人…"); }
        else if (data.type === "matched") { setState("chatting"); add("sys", "已配對成功！打聲招呼吧。"); }
        else if (data.type === "left") { setState("idle"); add("sys", "對方已離開聊天。"); }
        else if (data.type === "msg") { typing.textContent = ""; add("msg them", data.text); }
        else if (data.type === "typing") {
            typing.textContent = "對方正在輸入…";
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => (typing.textContent = ""), 3000);
        }
    };
    events.onerror = () => {
        if (state !== "idle") add("sys", "連線中斷，正在重新連線…");
        setState("idle");
    };

    action.onclick = () => {
        if (state === "idle" && id) return find();
        if (state === "chatting" && confirm("確定要離開這段聊天嗎？")) {
            send("leave");
            setState("idle");
            add("sys", "你已離開聊天。");
        }
    };

    text.oninput = () => {
        if (Date.now() - lastTypingSent > 1500) {
            lastTypingSent = Date.now();
            send("typing");
        }
    };

    document.getElementById("form").onsubmit = (e) => {
        e.preventDefault();
        const msg = text.value.trim();
        if (!msg || state !== "chatting") return;
        send("msg", { text: msg });
        add("msg me", msg);
        text.value = "";
    };
</script>
</body>
</html>
